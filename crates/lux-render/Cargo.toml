[package]
name = "lux-render"
description = "GPU rendering: wgpu context, glyph atlas, drawing primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `cargo bench -p lux-render` would otherwise also run this crate's own
# `#[cfg(test)]` unit tests through Rust's built-in libtest bench harness,
# which doesn't understand Criterion's `--baseline` flag (the two harnesses
# can't share one invocation) — disabling it here only affects `cargo
# bench`; `cargo test -p lux-render` (and its own unit tests) is unchanged.
bench = false

[dependencies]
dpi = "0.1.2"
etagere = "0.3.0"
fontique = { version = "0.11.0", default-features = false, features = ["std"] }
parley = { version = "0.11.0", default-features = false, features = ["std"] }
raw-window-handle = "0.6.2"
swash = "0.2.10"
wgpu = "30.0.0"

[dev-dependencies]
criterion = "0.8.2"
pollster = "1.0.1"

[[bench]]
name = "phase2_budgets"
harness = false
