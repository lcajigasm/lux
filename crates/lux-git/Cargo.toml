[package]
name = "lux-git"
description = "In-process Git integration via gix. No shell-out to the git binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gix = { version = "0.86.0", default-features = false, features = ["blob-diff", "revision", "sha1"] }
ignore = "0.4.31"

[dev-dependencies]
tempfile = "3"
