[package]
name = "lux-plugin"
description = "WASM plugin host (wasmtime, Component Model), capability-scoped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
wat = "1"
wasmtime = { version = "47.0.2", default-features = false, features = [
    "cranelift",
    "component-model",
    "runtime",
    "gc-drc",
] }

[dev-dependencies]
tempfile = "3"
