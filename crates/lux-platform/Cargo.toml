[package]
name = "lux-platform"
description = "Cross-platform window/input/IME/clipboard trait, with a winit-backed desktop implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
accesskit = "0.24.1"
accesskit_winit = { version = "0.33.2", default-features = false, features = ["rwh_06"] }
arboard = { version = "3.6.1", default-features = false }
dpi = "0.1.2"
raw-window-handle = "0.6.2"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Default features minus `wayland-csd-adwaita`: that feature pulls in
# `ttf-parser` via `sctk-adwaita`'s `ab_glyph` backend, and `ttf-parser` is
# unmaintained (RUSTSEC-2026-0192). `wayland-csd-adwaita-crossfont` gives the
# same Wayland client-side-decoration support through `crossfont` instead.
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-crossfont",
] }

# The unified title bar (traffic lights over the tab row) and the user's
# title-bar double-click setting need AppKit calls winit does not wrap.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSObject", "NSNotification", "NSUserDefaults", "NSGeometry", "NSAutoreleasePool"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSButton", "NSControl", "NSApplication", "NSEvent", "NSColor", "NSAppearance", "objc2-core-foundation"] }
