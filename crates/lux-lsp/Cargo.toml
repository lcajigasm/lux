[package]
name = "lux-lsp"
description = "Language Server Protocol client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# "tokio" feature: only needed for `PipeStdin`/`PipeStdout`'s non-blocking
# tokio-backed variant, used solely by the test-only fake server binary
# below (a genuinely non-blocking stdio wrapper is required there so its
# scripted background task can run concurrently with the main read loop).
# Production code (`session.rs`) talks to a real child process through
# `async-process`'s own `AsyncRead`/`AsyncWrite` impls, unaffected by this.
async-lsp = { version = "0.2.4", features = ["tokio"] }
async-process = "2"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
thiserror = "2"
# Non-Unix (Windows) fallback for the fake server binary's own stdio --
# see its module doc comment. `async-lsp`'s non-blocking `PipeStdin`/
# `PipeStdout` need `rustix`'s raw fd tricks, Unix-only.
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"

# A scripted fake LSP *server*, spawned as a real subprocess by
# `tests/fake_server_protocol.rs` -- the "servidor de mentira que ejerza
# el protocolo" Phase 7's acceptance criteria asks for, separate from the
# fuzzer. Not part of the public library surface.
[[bin]]
name = "lux-lsp-fake-server"
path = "tests/support/fake_server_main.rs"
test = false
doc = false
