[package]
name = "lux-ui"
description = "Editor widgets, layout, themes, and interaction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
accesskit = "0.24.1"
lux-core = { path = "../lux-core", version = "0.0.0" }
lux-render = { path = "../lux-render", version = "0.0.0" }
lux-search = { path = "../lux-search", version = "0.0.0" }
trash = "5.2.6"

[dev-dependencies]
accesskit_winit = { version = "0.33.2", default-features = false, features = ["rwh_06"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-crossfont"] }
