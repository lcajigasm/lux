# cargo-deny config. Generated from `cargo deny init` (cargo-deny 0.20.2) and
# trimmed to what Lux actually sets; see https://embarkstudios.github.io/cargo-deny/
# for the full schema of anything omitted here (defaults apply).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
# Lux is MIT OR Apache-2.0. Every dependency license here must be compatible
# with redistributing Lux under either of those. Add to this list only with
# a reason — an unexpected license on a new dependency should fail the build,
# not sail through silently.
# Start minimal (only what the workspace itself uses); extend this list in
# the same PR that adds a dependency needing a new entry, not preemptively.
allow = [
    "MIT",
    "Apache-2.0",
    # Added with `lux-platform`'s winit/arboard/rfd desktop backend
    # (Phase 2, "trait + impl winit"). All permissive/OSI-approved, or
    # weak-copyleft (MPL-2.0) in a way that only binds if we modify the
    # dependency's own source, which we don't.
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    # Added with `lux-render`'s `wgpu` context/surface (Phase 2, "contexto
    # wgpu, superficie, resize"): `foldhash` and `slotmap`, transitive via
    # `wgpu-hal`. Permissive, OSI-approved.
    "Zlib",
    # Added with `lux-workspace`'s native watchers (Phase 4, "watchers
    # nativos notify + debouncer"): `notify` 8.2.0 itself is CC0-1.0 (public
    # domain dedication) — no copyleft, no attribution requirement, fully
    # compatible with redistributing Lux under MIT OR Apache-2.0.
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
