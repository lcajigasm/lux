[package]
name = "lux-benches"
description = "Criterion benchmark harness. Real per-phase budgets land here as capabilities exist."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
criterion = "0.8.2"
lux-core = { path = "../crates/lux-core", version = "0.0.0" }
lux-search = { path = "../crates/lux-search", version = "0.0.0" }
lux-syntax = { path = "../crates/lux-syntax", version = "0.0.0" }
tree-sitter = "0.26.11"

[[bench]]
name = "smoke"
harness = false

[[bench]]
name = "phase1_budgets"
harness = false

[[bench]]
name = "phase3_budgets"
harness = false
