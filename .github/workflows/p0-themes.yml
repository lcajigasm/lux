name: P0 themes

# Standard macos-15. One renderer PNG per bundled theme, and a real-key
# check that the selector previews then Escape restores the previous theme.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  themes:
    name: bundled themes (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: rustup show

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Capture each theme and drive the selector
        run: |
          chmod +x scripts/p0-themes.sh scripts/stage-lux-app.sh
          ./scripts/p0-themes.sh

      - name: Upload theme captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-themes
          path: docs/evidence/themes/**
          if-no-files-found: error
