name: H1 cold start

# Release Lux.app, ten cold starts, one frame of the launch that presented.
# A missing sample or a missing frame fails the job. A budget miss does not.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold:
    name: h1 cold start (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Median of ten release launches
        run: |
          chmod +x scripts/h1-cold-start.sh scripts/stage-lux-app.sh
          ./scripts/h1-cold-start.sh
      - name: Upload the frame and the samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-cold-start
          path: docs/evidence/h1/**
          if-no-files-found: error
