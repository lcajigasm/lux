name: Release macOS

# Standard macos-14 runner. The repository is public, so this job is inside
# the included quota. Not a larger runner. Not a pull_request, not a branch
# push, and not a tag push.
# The Linux tag workflow publishes the GitHub Release; that single
# `published` event starts this job. Uploading the dmg and replacing
# SHA256SUMS edit the same release and do not publish a second one.
# workflow_dispatch is the manual retry, and it is not used by the tag workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the dmg to (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  dmg:
    name: lux-macos-universal
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout the published release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - name: Toolchain
        run: rustup show

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Universal disk image
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh dist lux-macos-universal.dmg

      - name: Upload to the triggering release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          files: dist/lux-macos-universal.dmg
          fail_on_unmatched_files: true

      - name: Add the disk image to SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir dist
          hash=$(shasum -a 256 dist/lux-macos-universal.dmg | awk '{print $1}')
          awk '$2 != "./lux-macos-universal.dmg" && $2 != "lux-macos-universal.dmg"' dist/SHA256SUMS > dist/SHA256SUMS.body
          printf '%s  ./lux-macos-universal.dmg\n' "$hash" >> dist/SHA256SUMS.body
          mv dist/SHA256SUMS.body dist/SHA256SUMS
          gh release upload "$RELEASE_TAG" dist/SHA256SUMS --clobber
