name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: lux
            asset: lux-linux-x86_64
          - os: macos-latest
            binary: lux
            asset: lux-macos-aarch64
          - os: windows-latest
            binary: lux.exe
            asset: lux-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Linux link libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Build release binary
        run: cargo build -p lux --release --locked

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p staging
          cp "target/release/${{ matrix.binary }}" "staging/${{ matrix.asset }}"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staging/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Checksums
        run: |
          mkdir -p assets
          find dist -type f -name 'lux-*' -exec cp {} assets/ \;
          cd assets
          sha256sum lux-* > SHA256SUMS
          ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            assets/lux-*
            assets/SHA256SUMS
