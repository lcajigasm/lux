name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Linux packages for a version tag. release-pr.yml creates that tag with
# GITHUB_TOKEN, which does not start this push trigger, and then dispatches
# this workflow on the tag. A tag pushed by a person still starts it.
# The universal disk image is release-pr.yml. Windows .msi stays
# scripts/package-msi.ps1. No signing secrets.

jobs:
  build:
    name: lux-linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Linux link libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Build release binary
        run: cargo build -p lux --release --locked

      - name: Stage raw binary
        run: |
          mkdir -p staging
          cp target/release/lux staging/lux-linux-x86_64

      - name: Package deb
        run: |
          version="${GITHUB_REF_NAME#v}"
          chmod +x scripts/package-deb.sh
          ./scripts/package-deb.sh "target/release/lux" "$version" "staging/lux-linux-amd64.deb"

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: lux-linux-x86_64
          path: staging/
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --dir assets --clobber
          fi
          find dist -type f \( -name 'lux-linux-*' -o -name '*.deb' \) -exec cp {} assets/ \;
          cd assets
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*
