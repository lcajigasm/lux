name: HTML preview

# Real Lux.app on macos-15. The preview pane renders a heading, paragraph,
# link, and preformatted line, then changes when the source is edited.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-preview:
    name: html preview (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: rustup show

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Render and edit the preview
        run: |
          chmod +x scripts/html-preview.sh scripts/html_preview_pixels.py scripts/stage-lux-app.sh scripts/macos-drive.sh
          ./scripts/html-preview.sh

      - name: Upload HTML preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-preview
          path: docs/evidence/html-preview/**
          if-no-files-found: warn
