name: macOS UI

# One standard macos-15 workflow for the pull-request UI jobs.
# debug-app and release-app compile lux once. The other jobs download
# that binary. A docs-only diff skips those jobs. Required checks stay
# in ci.yml and ok-gate.yml and always report their existing names.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: macOS UI paths
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.paths.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether UI jobs run
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          chmod +x scripts/ci-ui-paths.sh
          ./scripts/ci-ui-paths.sh --self-test
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          files="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$files"
          ui="$(printf '%s\n' "$files" | ./scripts/ci-ui-paths.sh)"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "ui=$ui"

  debug-app:
    name: lux debug binary (macos-15)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build debug lux
        run: cargo build -p lux --locked
      - name: Upload debug lux
        uses: actions/upload-artifact@v4
        with:
          name: lux-debug-bin
          path: target/debug/lux
          if-no-files-found: error

  release-app:
    name: lux release binary (macos-15)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build release lux
        run: cargo build -p lux --release --locked
      - name: Upload release lux
        uses: actions/upload-artifact@v4
        with:
          name: lux-release-bin
          path: target/release/lux
          if-no-files-found: error

  app-icon-dock:
    needs: [changes, debug-app]
    if: needs.changes.outputs.ui == 'true' && needs.debug-app.result == 'success'
    name: app icon (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Raster tools
        run: brew install librsvg
      - name: Toolchain
        run: rustup show
      - name: Prebuilt Lux binary
        uses: ./.github/actions/prebuilt-lux
        with:
          profile: debug
      - name: Dock captures
        run: chmod +x scripts/build-app-icon.sh scripts/app-icon-shot.sh && ./scripts/app-icon-shot.sh
      - name: Upload Dock captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-icon
          path: docs/evidence/app-icon/**
          if-no-files-found: error

