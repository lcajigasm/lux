name: macOS UI

# One macos-15 runner compiles Lux.app once and runs every UI scenario.
# H1-H6 and the other release timings are macos-perf.yml. Required checks
# stay in ci.yml and ok-gate.yml. "macos suite" is green when the scenarios
# pass, and also when a docs-only or version-only diff skips them.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: macOS UI paths
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.paths.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether UI scenarios run
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci-ui-paths.sh
          ./scripts/ci-ui-paths.sh --self-test
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          git diff --unified=3 "$BASE_SHA" HEAD > "$RUNNER_TEMP/pr.diff"
          ui="$(./scripts/ci-ui-paths.sh --diff "$RUNNER_TEMP/pr.diff")"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "ui=$ui"

  scenarios:
    name: macOS UI scenarios
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Icon tools
        run: brew install librsvg
      - name: Build Lux.app once
        run: |
          chmod +x scripts/stage-lux-app.sh
          ./scripts/stage-lux-app.sh
          test -x target/debug/lux
      - name: UI scenarios
        env:
          LUX_PREBUILT: "1"
        run: |
          chmod +x scripts/macos-ui-suite.sh
          ./scripts/macos-ui-suite.sh
      - name: Upload UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-suite
          path: |
            docs/evidence/**
            docs/compare/**
            docs/receipts/**
          if-no-files-found: warn

  macos-suite:
    name: macos suite
    needs: [changes, scenarios]
    if: always() && !cancelled() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        env:
          SCENARIOS: ${{ needs.scenarios.result }}
        run: |
          set -euo pipefail
          echo "macOS UI scenarios: $SCENARIOS"
          case "$SCENARIOS" in
            success|skipped) exit 0 ;;
          esac
          echo "macos suite is red because the UI scenarios ${SCENARIOS}"
          exit 1
