name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Pull-request and main CI stay on ubuntu-latest only. The universal macOS
# disk image is .github/workflows/release-macos.yml, which runs only on
# workflow_dispatch or a v* tag (macos minutes on a private repo bill at 10x).

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo test --workspace

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  core-isolation:
    name: lux-core has no UI dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-core-isolation.sh

  limits:
    name: file/struct size limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-limits.sh

  release-latency:
    name: release typing budget (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Release-mode 8 ms typing budget
        run: cargo test -p lux --release test_continuous_typing_latency_large_file_under_8ms -- --nocapture
