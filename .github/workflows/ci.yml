name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  core-isolation:
    name: lux-core has no UI dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-core-isolation.sh

  limits:
    name: file/struct size limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-limits.sh

  bench:
    name: benchmarks vs stored baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # criterion panics if asked to compare against a baseline that doesn't
      # exist yet, so the very first run (or the run right after someone
      # deliberately resets the baseline, see docs/PERFORMANCE.md) bootstraps
      # it instead of comparing. Every run after that compares and gates.
      - name: Restore criterion baseline
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: target/criterion
          key: criterion-baseline-main

      # Scoped to lux-benches, never --workspace: every other crate's lib/bin
      # target also gets an implicit bench harness by default, and that
      # harness is plain libtest — it doesn't understand criterion flags like
      # --save-baseline and aborts the job. Only lux-benches has real
      # criterion [[bench]] targets.
      - name: Bootstrap baseline (no stored baseline yet — nothing to compare)
        if: steps.restore.outputs.cache-hit != 'true'
        run: cargo bench -p lux-benches -- --save-baseline main

      - name: Compare against the stored baseline
        if: steps.restore.outputs.cache-hit == 'true'
        run: cargo bench -p lux-benches -- --baseline main

      - name: Fail on >10% regression
        if: steps.restore.outputs.cache-hit == 'true'
        run: ./scripts/check-bench-regression.sh main

      - name: Persist criterion baseline
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target/criterion
          key: criterion-baseline-main
