name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A new push to the same branch or pull request cancels this workflow
# only. It does not cancel macos-ui.yml or ok-gate.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Linux jobs stay on ubuntu-latest. Pull requests and main also run one
# standard macos-15 job: cargo test. Its name is the required check
# "cargo test and universal dmg (macos-15)". The universal image is built
# by release-pr.yml when a release pull request merges, not on this job.
# UI scenarios are macos-ui.yml. H1-H6 are macos-perf.yml. Neither is a
# required check. Windows stays out of CI. No larger runners.
# The repository is public, so these standard runners are inside the
# included quota.

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo test --workspace

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  core-isolation:
    name: lux-core has no UI dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-core-isolation.sh

  limits:
    name: file/struct size limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-limits.sh

  release-latency:
    name: release typing budget (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Release-mode 8 ms typing budget
        run: cargo test -p lux --release test_continuous_typing_latency_large_file_under_8ms -- --nocapture

  macos:
    name: cargo test and universal dmg (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      # The universal disk image is release-pr.yml, after a merged
      # "chore: release X" pull request. Building it here took 36m35s
      # of run 44280711514 (job 134720328480) on top of a 4m59s test.
      # The job name stays so the required check still reports.
