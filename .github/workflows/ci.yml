name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Linux jobs stay on ubuntu-latest. Pull requests and main also run one
# standard macos-15 job (tests, plus a universal .app/.dmg artifact that
# is not published). Windows stays out of CI. No larger runners.
# release-macos.yml still publishes the disk image only when a GitHub
# Release is published, or on workflow_dispatch. The repository is public,
# so these standard runners are inside the included quota.

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo test --workspace

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  core-isolation:
    name: lux-core has no UI dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-core-isolation.sh

  limits:
    name: file/struct size limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-limits.sh

  release-latency:
    name: release typing budget (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Release-mode 8 ms typing budget
        run: cargo test -p lux --release test_continuous_typing_latency_large_file_under_8ms -- --nocapture

  macos:
    name: cargo test and universal dmg (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test
        run: cargo test --workspace
      - name: Universal disk image
        run: |
          # cargo test leaves a debug tree the disk image does not need.
          # Keeping it, then building both release architectures, makes
          # hdiutil fail with "No space left on device" on the macOS runner
          # (runs 41299748706 and 41300655725).
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" \
                 "$HOME/Library/Developer/CoreSimulator/Caches" \
                 target/debug target/*/debug
          df -h /
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh dist lux-macos-universal.dmg
      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lux-macos-universal
          path: |
            dist/lux-macos-universal.dmg
            dist/Lux.app
          if-no-files-found: error
