name: Triple click

# Real Lux.app on macos-15. A triple click selects the whole line.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  line:
    name: triple click (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: rustup show

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Select a line with a triple click
        run: |
          chmod +x scripts/triple-click.sh scripts/stage-lux-app.sh scripts/macos-drive.sh
          ./scripts/triple-click.sh

      - name: Upload the line capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triple-click
          path: docs/evidence/triple-click/**
          if-no-files-found: error
