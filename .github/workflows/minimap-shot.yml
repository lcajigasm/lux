name: Minimap frame

# Free macos-15. One PNG of the compiled window with the minimap frame.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shot:
    name: minimap frame (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Capture the minimap
        run: |
          chmod +x scripts/minimap-shot.sh scripts/stage-lux-app.sh scripts/macos-drive.sh
          ./scripts/minimap-shot.sh
      - name: Upload minimap-frame.png
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimap-frame
          path: docs/evidence/minimap-frame.png
          if-no-files-found: error
