name: Tab view audit

# Real Lux.app on macos-15. Opening Settings as JSON and closing it must
# leave the Plain Text buffer without that file's highlighting, diagnostics,
# or red paint. Switching languages must keep each view on its own buffer.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tab-view-audit:
    name: tab view audit (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: rustup show

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Open, close, and switch buffers
        run: |
          chmod +x scripts/tab-view-audit.sh scripts/tab_view_pixels.py scripts/stage-lux-app.sh scripts/macos-drive.sh
          ./scripts/tab-view-audit.sh

      - name: Upload tab view audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-view-audit
          path: docs/evidence/tab-view-audit/**
          if-no-files-found: warn
