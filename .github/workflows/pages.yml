name: Deploy GitHub Pages

# Push to main no longer deploys. Run 41274477945 (commit 8a27f6f) uploaded
# the site artifact and then GitHub returned HTTP 422 Validation Failed from
# the Pages deployment API. The same workflow succeeded on 2026-10-31, the
# github-pages environment still allows main, and the repository stays
# private. That 422 is the private-Pages rejection, not a bad artifact.
# Dispatch remains so a retry does not run on every push. This file does
# not change repository visibility or billing.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
