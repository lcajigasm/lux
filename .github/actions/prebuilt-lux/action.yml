name: Prebuilt Lux
description: Download the Lux binary this workflow already compiled.

inputs:
  profile:
    description: debug or release
    required: true

runs:
  using: composite
  steps:
    - name: Download prebuilt Lux
      uses: actions/download-artifact@v4
      with:
        name: lux-${{ inputs.profile }}-bin
        path: target/${{ inputs.profile }}

    - name: Mark the binary prebuilt
      shell: bash
      run: |
        chmod +x "target/${{ inputs.profile }}/lux"
        test -x "target/${{ inputs.profile }}/lux"
        echo LUX_PREBUILT=1 >> "$GITHUB_ENV"
